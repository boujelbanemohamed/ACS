version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: banking_redis
    ports:
      - "16379:6379"
    networks:
      - banking_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    container_name: banking_postgres
    environment:
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_password
      POSTGRES_DB: banking_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - banking_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: banking_pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: banking_user
      DB_PASSWORD: banking_password
      DB_NAME: banking_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 100
    ports:
      - "15433:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banking_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banking_backend
    command: sh -c "npm install && npm run start:pm2"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: banking_db
      DB_USER: banking_user
      DB_PASSWORD: banking_password
      DB_POOL_MAX: 100
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret_key_not_for_production_use_only_12345678901234567890
      PAN_ENCRYPTION_KEY: dev-encryption-key-32chars!xyz
      CORS_ORIGIN: http://localhost:3000,http://localhost:8088
      PM2_INSTANCES: 4
      PM2_MAX_MEMORY: 512M
    ports:
      - "8000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - banking_network
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banking_worker
    command: sh -c "npm install && node services/worker.js"
    environment:
      NODE_ENV: production
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: banking_db
      DB_USER: banking_user
      DB_PASSWORD: banking_password
      DB_POOL_MAX: 100
      REDIS_URL: redis://redis:6379
      PAN_ENCRYPTION_KEY: dev-encryption-key-32chars!xyz
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - banking_network
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    restart: unless-stopped
    deploy:
      replicas: 2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8000/api
    container_name: banking_frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
    ports:
      - "8088:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - banking_network
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:

networks:
  banking_network:
    driver: bridge
