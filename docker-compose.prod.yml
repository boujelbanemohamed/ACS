services:
  redis:
    image: redis:7-alpine
    container_name: banking_redis_prod
    restart: always
    networks:
      - banking_network_prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data_prod:/data

  postgres:
    image: postgres:15-alpine
    container_name: banking_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-banking_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-banking_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - banking_network_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-banking_user} -d ${DB_NAME:-banking_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    container_name: banking_pgbouncer_prod
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-banking_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-banking_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 100
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - banking_network_prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banking_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-banking_db}
      DB_USER: ${DB_USER:-banking_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: 100
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PAN_ENCRYPTION_KEY: ${PAN_ENCRYPTION_KEY}
      TZ: ${TZ:-Africa/Tunis}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-*/5 * * * *}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      PASSWORD_EXPIRY_DAYS: ${PASSWORD_EXPIRY_DAYS:-90}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      PM2_INSTANCES: ${PM2_INSTANCES:-max}
      PM2_MAX_MEMORY: ${PM2_MAX_MEMORY:-512M}
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      pgbouncer:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - banking_network_prod
    environment:
      PM2_INSTANCES: ${PM2_INSTANCES:-max}
      PM2_MAX_MEMORY: ${PM2_MAX_MEMORY:-512M}
      QUEUE_JOB_ATTEMPTS: ${QUEUE_JOB_ATTEMPTS:-3}
      QUEUE_BACKOFF_DELAY: ${QUEUE_BACKOFF_DELAY:-5000}
      QUEUE_JOB_TIMEOUT: ${QUEUE_JOB_TIMEOUT:-120000}
      QUEUE_KEEP_COMPLETE: ${QUEUE_KEEP_COMPLETE:-100}
      QUEUE_KEEP_FAILED: ${QUEUE_KEEP_FAILED:-50}
      QUEUE_MAX_PER_SECOND: ${QUEUE_MAX_PER_SECOND:-5}
      DB_BATCH_SIZE: ${DB_BATCH_SIZE:-100}
    volumes:
      - banking_data:/data

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banking_worker_prod
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-banking_db}
      DB_USER: ${DB_USER:-banking_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: 100
      REDIS_URL: redis://redis:6379
      PAN_ENCRYPTION_KEY: ${PAN_ENCRYPTION_KEY}
    depends_on:
      pgbouncer:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - banking_network_prod
    environment:
      WORKER_INSTANCES: ${WORKER_INSTANCES:-2}
      WORKER_MAX_MEMORY: ${WORKER_MAX_MEMORY:-512M}
    volumes:
      - banking_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    container_name: banking_frontend_prod
    restart: always
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - banking_network_prod

volumes:
  redis_data_prod:
  postgres_data_prod:
  banking_data:

networks:
  banking_network_prod:
    driver: bridge
