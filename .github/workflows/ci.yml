name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: banking_user
          POSTGRES_PASSWORD: banking_password
          POSTGRES_DB: banking_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banking_user -d banking_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: banking_db
      DB_USER: banking_user
      DB_PASSWORD: banking_password
      JWT_SECRET: test_jwt_secret_key_32_characters_long!
      PAN_ENCRYPTION_KEY: test-pan-key-32chars!!
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Les dépendances de développement (jest, supertest) sont nécessaires aux tests
      - run: npm ci

      - name: Syntax check
        run: find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Initialize database schema
        env:
          PGPASSWORD: banking_password
        run: psql -h localhost -U banking_user -d banking_db -v ON_ERROR_STOP=1 -q -f init.sql

      - name: Run backend tests
        run: npm test -- --forceExit

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false

      - name: Build frontend
        run: npm run build
